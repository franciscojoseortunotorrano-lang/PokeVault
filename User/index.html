<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Pokémon TCG</title>
    <!-- ENLACE AL ARCHIVO CSS CORREGIDO -->
    <link rel="stylesheet" href="../css/styles_2.css">
</head>
<body>
    <header>
        <div class="logo-header-container">
            <img src="../imagenes/logo.png" alt="Pokémon Logo" class="logo-header">
        </div>
    </header>

    <nav>
        <div class="nav-links">
            <a href="#">Gestionar Cartas</a>
            <a href="#">Gestionar Perfil</a>
        </div>
        <div class="user-profile">
            <img src="../imagenes/foto.png" alt="Foto usuario" class="user-avatar">
            <p class="user-name">Nombre Usuario</p>
        </div>
    </nav>

    <section>
        <div class="contenedorCartas">
            <!-- Ejemplo de Carta 1 -->
            <div class="carta">
                <div class="carta-frame">
                    <img src="../imagenes/cartaEjemplo.png" alt="Carta Pokémon" class="carta-img">
                </div>
                <div class="carta-acciones">
                    <a href="#" class="btn-modificar">Modificar</a>
                    <a href="#" class="btn-borrar">Borrar</a>
                    <a href="#" class="btn-eliminar">Eliminar</a>
                </div>
            </div>
        </div>
    </section>

    <footer>
        <img src="../imagenes/logo.png" alt="Logo" class="logo-footer">
        <p class="copyright"></p>
        <a class="ancla" href="#">⇮</a>
    </footer>
</body>
</html>
