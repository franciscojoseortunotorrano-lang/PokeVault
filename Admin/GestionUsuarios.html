<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Pokémon TCG</title>
    <!-- ENLACE AL ARCHIVO CSS CORREGIDO -->
    <link rel="stylesheet" href="../css/styles_Gestion_usuarios.css">
</head>
<body>
    <header>
        <div class="logo-header-container">
            <img src="../imagenes/logo.png" alt="Pokémon Logo" class="logo-header">
        </div>
    </header>

    <nav>
        <!-- Interruptor para menú hamburguesa en pantallas pequeñas -->
        <input type="checkbox" id="menu-toggle" class="menu-toggle-checkbox">
        <label for="menu-toggle" class="menu-toggle-btn" aria-label="Abrir o cerrar menú">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </label>

        <!-- Contenedor del menú superior -->
        <div class="nav-menu-content">
            <div class="nav-links">
                <a href="./ListadoCartas.html">Cartas</a>
                <a href="./Perfil.html">Perfil</a>
                <a href="./Noticias.html">Noticias</a>
                <a href="./GestionUsuarios.html">Usuarios</a>
            </div>

            <div class="user-profile">
                <img src="../imagenes/foto.png" alt="Foto usuario" class="user-avatar">
                <a class="user-name" href="#">Nombre Usuario</a>
            </div>
        </div>
    </nav>

    <!-- Cuerpo de la página: Sección Gestion de usuarios -->
    <section>
        <div class="contenedorBuscador">
            <form action="" class="buscador">
                <input type="text" name="busqueda" id="busqueda" placeholder="Usuario o id de usuario">
                <input type="submit" value="🔍 Buscar">
            </form>
        </div>
        <div class="panelUsuarios">
            <div class="usuario">
                <span class="foto-perfil"><img src="../imagenes/foto.png" alt=""></span>
                <a href="#">Usuario 1</a>
            </div>
            <div class="usuario">
                <span class="foto-perfil"><img src="../imagenes/foto.png" alt=""></span>
                <a href="#">Usuario 2</a>
            </div>
            <div class="usuario">
                <span class="foto-perfil"><img src="../imagenes/foto.png" alt=""></span>
                <a href="#">Usuario 3</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <img src="../imagenes/logo.png" alt="Logo" class="logo-footer">
        <p class="copyright">®PokeVault. Todos los derechos reservados</p>
        <a class="ancla" href="#">⇮</a>
    </footer>
</body>
</html>
