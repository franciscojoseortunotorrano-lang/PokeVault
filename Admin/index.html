<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administrador - Pokémon TCG</title>
    <!-- ENLACE AL ARCHIVO CSS CORREGIDO -->
    <link rel="stylesheet" href="../css/styles_5.css">
</head>
<body>
    <header>
        <div class="logo-header-container">
            <img src="../imagenes/logo.png" alt="Pokémon Logo" class="logo-header" >
        </div>
    </header>

    <nav>
        <!--Barra de navegacion-->
        <div class="nav-links">
            <a href="#">Cartas</a>
            <a href="#">Perfil</a>
            <a href="#">Noticias</a>
            <a href="#">Usuarios</a>
        </div>
        <!--Apartado de usuario-->
        <div class="user-profile">
            <img src="../imagenes/foto.png" alt="Foto usuario" class="user-avatar">
            <a class="user-name" href="#">Nombre Usuario</a>
        </div>
    </nav>
    <!--Cuerpo de la página-->
    <section>
        <div class="contenedorCartas">
            <!--navbar del contenedor-->
            <div>
                <a href="#">Filtrar</a>
                <a href="#">modificar</a>
                <a href="#">borrar</a>
            </div>
            <button>←</button>
            <!-- Ejemplo de Carta -->
            <div class="carta">
                <div class="carta-frame">
                    <img src="../imagenes/1.png" alt="Carta Pokémon" class="carta-img">
                </div>
            </div>
            <div class="carta">
                <div class="carta-frame">
                    <img src="../imagenes/2.png" alt="Carta Pokémon" class="carta-img">
                </div>
            </div>
            <div class="carta">
                <div class="carta-frame">
                    <img src="../imagenes/3.png" alt="Carta Pokémon" class="carta-img">
                </div>
            </div>
            <button>→</button>
        </div>
    </section>
    <!--Footer con el logo e informacion legal-->
    <footer>
        <img src="../imagenes/logo.png" alt="Logo" class="logo-footer">
        <p class="copyright">®PokeVault. Todos los derechos reservados</p>
        <a class="ancla" href="#">⇮</a>
    </footer>
</body>
</html>
